name: CI for Microservices

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  user-service:
    name: Build, Test & SonarQube - User Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: user_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d user_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.14  # Changed to a precise version
          cache: pip  # Cache pip dependencies for faster runs
          cache-dependency-path: user-service/requirements.txt

      - name: 📦 Install dependencies
        run: |
          cd user-service
          pip install -r requirements.txt

      - name: 🧪 Run unit tests
        run: |
          cd user-service
          python -m unittest discover -s tests || echo "No tests found, continuing..."

      - name: 🐳 Build Docker image
        run: |
          docker build -t user-service:latest ./user-service

      - name: 🔍 Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd user-service
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip
          unzip sonar-scanner.zip
          ./sonar-scanner-*/bin/sonar-scanner \
            -Dsonar.projectKey=user-service \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

